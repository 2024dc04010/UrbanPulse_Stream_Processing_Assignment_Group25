version: '3.8'

# ============================================================
# UrbanPulse Task C — Docker Compose
# Services: Flink JobManager, Flink TaskManager, Spark Master
#
# Kafka runs separately (Task B) on the host at localhost:9092.
# On macOS, containers reach the host via host.docker.internal:9092.
# On Linux, set KAFKA_HOST=172.17.0.1 in a .env file or export it.
# ============================================================

x-flink-common:
  &flink-common
  build:
    context: .
    dockerfile: Dockerfile.flink
  # Allow containers to reach host Kafka on macOS
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      taskmanager.numberOfTaskSlots: 6
      parallelism.default: 1
      state.backend: filesystem
      state.checkpoints.dir: file:///tmp/flink-checkpoints
      heartbeat.timeout: 60000

services:

  # ─────────────────────────────────────────
  # Flink JobManager (UI + job coordination)
  # ─────────────────────────────────────────
  flink-jobmanager:
    <<: *flink-common
    container_name: urbanpulse-flink-jobmanager
    hostname: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"    # Flink Web UI
    volumes:
      - ./flink:/opt/flink/jobs          # Flink Python job scripts
      - ./output:/output                 # Shared output directory
      - flink-checkpoints:/tmp/flink-checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # Flink TaskManager (executes jobs)
  # ─────────────────────────────────────────
  flink-taskmanager:
    <<: *flink-common
    container_name: urbanpulse-flink-taskmanager
    hostname: flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - ./flink:/opt/flink/jobs
      - ./output:/output
      - flink-checkpoints:/tmp/flink-checkpoints

  # ─────────────────────────────────────────
  # Spark (Master + Worker in one container)
  # ─────────────────────────────────────────
  spark:
    image: bitnami/spark:3.5
    container_name: urbanpulse-spark
    hostname: spark
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_URL=spark://spark:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"    # Spark Web UI
      - "7077:7077"    # Spark master port
    volumes:
      - ./spark:/opt/spark/jobs           # Spark Python job scripts
      - ./data:/opt/spark/data            # Static reference data (zone_profile.csv)
      - ./output:/output                  # Parquet output directory

volumes:
  flink-checkpoints:
